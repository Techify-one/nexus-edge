name: Publish Core distribution

on:
  push:
    tags:
      - "core-distribution-v*"
  workflow_call:
    inputs:
      version:
        description: Exact Core version from package.json
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Exact Core version from package.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: core-distribution-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: installer-release-build
    env:
      INSTALLER_RELEASE_PRIVATE_KEY_PKCS8_BASE64: ${{ secrets.INSTALLER_RELEASE_PRIVATE_KEY_PKCS8_BASE64 }}
      INSTALLER_RELEASE_PUBLIC_KEY_SPKI_BASE64: ${{ vars.INSTALLER_RELEASE_PUBLIC_KEY_SPKI_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Resolve release version
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            release_version="${{ inputs.version }}"
          else
            release_version="${GITHUB_REF_NAME#core-distribution-v}"
          fi
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version" >&2
            exit 1
          fi
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "$release_version" != "$package_version" ]]; then
            echo "package.json is $package_version, not $release_version" >&2
            exit 1
          fi
          echo "CORE_DISTRIBUTION_VERSION=$release_version" >> "$GITHUB_ENV"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:matrix
      - run: pnpm openapi:check
      - run: pnpm build
      - run: pnpm verify:artifacts
      - run: pnpm verify:bundle
      - run: pnpm core:distribution:build
      - uses: actions/upload-artifact@v7
        with:
          name: core-distribution-${{ env.CORE_DISTRIBUTION_VERSION }}
          path: artifacts/core-distribution
          if-no-files-found: error
          retention-days: 7

  publish-immutable:
    needs: build
    runs-on: ubuntu-latest
    environment: installer-release-publish
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          pattern: core-distribution-*
          path: artifacts/core-distribution
          merge-multiple: true
      - name: Upload immutable objects to staging
        env:
          CORE_DISTRIBUTION_BUCKET: ${{ vars.INSTALLER_STAGING_RELEASE_BUCKET }}
        run: pnpm core:distribution:publish-objects
      - name: Promote staging for canary
        env:
          CORE_DISTRIBUTION_BUCKET: ${{ vars.INSTALLER_STAGING_RELEASE_BUCKET }}
        run: pnpm core:distribution:promote
      - name: Upload immutable objects to production
        env:
          CORE_DISTRIBUTION_BUCKET: ${{ vars.INSTALLER_PRODUCTION_RELEASE_BUCKET }}
        run: pnpm core:distribution:publish-objects

  canary-gate:
    needs: publish-immutable
    runs-on: ubuntu-latest
    environment: installer-canary-approval
    steps:
      - name: Verify staging installer is reachable
        env:
          INSTALLER_STAGING_URL: ${{ vars.INSTALLER_STAGING_URL }}
          EXPECTED_CORE_VERSION: ${{ inputs.version }}
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          if [[ -z "$EXPECTED_CORE_VERSION" ]]; then
            export EXPECTED_CORE_VERSION="${GITHUB_REF_NAME#core-distribution-v}"
          fi
          node --input-type=module <<'NODE'
          const baseUrl = process.env.INSTALLER_STAGING_URL;
          const expectedVersion = process.env.EXPECTED_CORE_VERSION;
          const expectedCommit = process.env.EXPECTED_SOURCE_COMMIT;
          const eventually = async (path, predicate) => {
            let detail = "no response";
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                const response = await fetch(`${baseUrl}${path}`, {
                  headers: { "Cache-Control": "no-cache" },
                });
                const body = await response.text();
                if (response.ok) {
                  const parsed = JSON.parse(body);
                  if (predicate(parsed)) return;
                  detail = `unexpected response: ${body}`;
                } else {
                  detail = `HTTP ${response.status}: ${body}`;
                }
              } catch (error) {
                detail = error instanceof Error ? error.message : String(error);
              }
              if (attempt < 12)
                await new Promise((resolve) => setTimeout(resolve, 5_000));
            }
            throw new Error(`${path} unavailable: ${detail}`);
          };
          await eventually("/health", (health) => health.ok === true);
          await eventually(
            "/api/releases/stable",
            (release) =>
              release.version === expectedVersion &&
              release.sourceCommit === expectedCommit &&
              Boolean(release.manifestHash),
          );
          NODE
      - name: Record protected canary approval
        run: echo "Canary evidence reviewed by protected-environment approver."

  promote-production:
    needs: canary-gate
    runs-on: ubuntu-latest
    environment: installer-release-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CORE_DISTRIBUTION_BUCKET: ${{ vars.INSTALLER_PRODUCTION_RELEASE_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          pattern: core-distribution-*
          path: artifacts/core-distribution
          merge-multiple: true
      - run: pnpm core:distribution:promote
