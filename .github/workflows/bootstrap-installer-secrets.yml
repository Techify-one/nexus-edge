name: Bootstrap standalone Installer secrets

on:
  pull_request:
    paths:
      - ".github/workflows/bootstrap-installer-secrets.yml"

permissions:
  contents: read

jobs:
  transfer:
    if: github.head_ref == 'ops/bootstrap-installer-secrets'
    runs-on: ubuntu-latest
    environment: installer-test
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ secrets.INSTALLER_BOOTSTRAP_GITHUB_TOKEN }}
    steps:
      - name: Transfer protected deployment credentials
        run: |
          printf '%s' "$CLOUDFLARE_API_TOKEN" |
            gh secret set CLOUDFLARE_API_TOKEN --repo Techify-one/nexus-edge-installer
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" |
            gh secret set CLOUDFLARE_ACCOUNT_ID --repo Techify-one/nexus-edge-installer
      - name: Verify secret metadata
        run: |
          installed_secrets="$(gh secret list --repo Techify-one/nexus-edge-installer --json name --jq '.[].name')"
          grep -qx CLOUDFLARE_API_TOKEN <<<"$installed_secrets"
          grep -qx CLOUDFLARE_ACCOUNT_ID <<<"$installed_secrets"
