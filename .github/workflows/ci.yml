name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:matrix
      - run: pnpm openapi:check
      - run: pnpm build
      - run: pnpm verify:artifacts
      - run: pnpm verify:bundle

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://modular-workers-core.francisconeto.workers.dev
    concurrency:
      group: modular-workers-core-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CORE_WORKER_NAME: modular-workers-core
      CORE_WRANGLER_CONFIG: workers/core/wrangler.production.jsonc
      WORKER_URL: https://modular-workers-core.francisconeto.workers.dev
      CATALOG_WRANGLER_CONFIG: workers/plugin-catalog/wrangler.production.jsonc
      CATALOG_WORKER_URL: https://nexus-edge-plugins.francisconeto.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations
        run: >-
          pnpm exec wrangler d1 migrations apply modular-workers-app-db
          --remote --config "$CORE_WRANGLER_CONFIG"
      - name: Configure installer secrets
        run: |
          node --input-type=module <<'NODE' | pnpm exec wrangler secret bulk --config "$CORE_WRANGLER_CONFIG"
          process.stdout.write(JSON.stringify({
            CF_API_TOKEN: process.env.CF_API_TOKEN,
            CF_ACCOUNT_ID: process.env.CF_ACCOUNT_ID,
          }));
          NODE
      - name: Deploy Core Worker
        run: pnpm deploy:core
      - name: Deploy plugin catalog Worker
        run: pnpm exec wrangler deploy --config "$CATALOG_WRANGLER_CONFIG"
      - name: Verify production
        run: |
          node --input-type=module <<'NODE'
          const baseUrl = process.env.WORKER_URL;
          for (const path of ["/health", "/api/v1/setup/status"]) {
            const response = await fetch(`${baseUrl}${path}`);
            if (!response.ok) {
              throw new Error(`${path} returned HTTP ${response.status}`);
            }
            const body = await response.json();
            if (path === "/health" && (!body.ok || body.provider !== "d1")) {
              throw new Error(`Unexpected health response: ${JSON.stringify(body)}`);
            }
          }

          const catalogUrl = process.env.CATALOG_WORKER_URL;
          const healthResponse = await fetch(`${catalogUrl}/health`);
          if (!healthResponse.ok) {
            throw new Error(`Catalog /health returned HTTP ${healthResponse.status}`);
          }
          const health = await healthResponse.json();
          if (!health.ok || health.service !== "nexus-edge-plugin-catalog") {
            throw new Error(`Unexpected catalog health: ${JSON.stringify(health)}`);
          }
          const catalogResponse = await fetch(`${catalogUrl}/api/plugins`);
          if (!catalogResponse.ok) {
            throw new Error(`Catalog API returned HTTP ${catalogResponse.status}`);
          }
          const catalog = await catalogResponse.json();
          const pluginIds = catalog.plugins?.map(({ id }) => id).sort();
          if (JSON.stringify(pluginIds) !== JSON.stringify(["crm", "meta_ads"])) {
            throw new Error(`Unexpected public catalog: ${JSON.stringify(catalog)}`);
          }
          const pageResponse = await fetch(catalogUrl);
          if (!pageResponse.ok || !(await pageResponse.text()).includes("Plugins para Nexus Edge")) {
            throw new Error("Catalog page returned an unexpected response");
          }
          NODE
