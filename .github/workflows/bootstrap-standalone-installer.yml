name: Bootstrap standalone Installer

on:
  pull_request:
    paths:
      - ".github/workflows/bootstrap-standalone-installer.yml"

permissions:
  contents: read

jobs:
  deploy:
    if: github.head_ref == 'ops/bootstrap-installer-1.0.1'
    runs-on: ubuntu-latest
    environment:
      name: installer-test
      url: https://installer.francisconeto.net.br
    concurrency:
      group: nexus-edge-installer-test
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Techify-one/nexus-edge-installer
          ref: 327cee702f24ece535bc6c06028255e8d3689bf3
      - uses: pnpm/action-setup@v6
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm deploy
      - name: Verify standalone Installer and latest Core
        run: |
          node --input-type=module <<'NODE'
          const baseUrl = "https://installer.francisconeto.net.br";
          const eventually = async (path) => {
            let detail = "no response";
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                const response = await fetch(`${baseUrl}${path}`, {
                  headers: { "Cache-Control": "no-cache" },
                });
                const body = await response.text();
                if (response.ok) return JSON.parse(body);
                detail = `HTTP ${response.status}: ${body}`;
              } catch (error) {
                detail = error instanceof Error ? error.message : String(error);
              }
              if (attempt < 12)
                await new Promise((resolve) => setTimeout(resolve, 5_000));
            }
            throw new Error(`${path} unavailable: ${detail}`);
          };
          const health = await eventually("/health");
          if (
            !health.ok ||
            health.service !== "nexus-edge-installer" ||
            health.version !== "1.0.1"
          )
            throw new Error(`Unexpected health: ${JSON.stringify(health)}`);
          const release = await eventually("/api/releases/stable");
          if (
            release.version !== "1.1.0-beta.9" ||
            release.sourceCommit !==
              "10afd2aeaefbef48b31601a56e62879483a88f88"
          )
            throw new Error(`Unexpected release: ${JSON.stringify(release)}`);
          NODE
