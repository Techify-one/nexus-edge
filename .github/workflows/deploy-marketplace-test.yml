name: Deploy marketplace test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-edge-marketplace-test
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  MARKETPLACE_TEST_BETTER_AUTH_SECRET: ${{ secrets.MARKETPLACE_TEST_BETTER_AUTH_SECRET }}
  MARKETPLACE_TEST_WEBHOOK_ENCRYPTION_KEY: ${{ secrets.MARKETPLACE_TEST_WEBHOOK_ENCRYPTION_KEY }}
  APP_INSTALLATION_ID: install_marketplace_test_14fba1f8103248daadaf2c95ac5e0f7f
  CORE_D1_DATABASE_NAME: nexus-edge-marketplace-test-db
  CORE_WORKER_NAME: nexus-edge-marketplace-test
  CORE_WRANGLER_CONFIG: workers/core/wrangler.marketplace-test.jsonc
  WORKER_URL: https://nexus-edge-marketplace-test.francisconeto.workers.dev

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:matrix
      - run: pnpm openapi:check
      - run: pnpm build
      - run: pnpm verify:artifacts
      - run: pnpm verify:bundle

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: marketplace-test
      url: https://nexus-edge-marketplace-test.francisconeto.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Provision isolated Cloudflare resources
        run: node scripts/provision-marketplace-test.mjs
      - name: Apply D1 migrations
        run: pnpm provision:d1
      - name: Initial Core deployment
        run: pnpm deploy:core
      - name: Configure isolated runtime secrets
        run: |
          node --input-type=module <<'NODE' | pnpm exec wrangler secret bulk --config "$CORE_WRANGLER_CONFIG"
          process.stdout.write(JSON.stringify({
            BETTER_AUTH_SECRET: process.env.MARKETPLACE_TEST_BETTER_AUTH_SECRET,
            WEBHOOK_ENCRYPTION_KEY: process.env.MARKETPLACE_TEST_WEBHOOK_ENCRYPTION_KEY,
            CF_API_TOKEN: process.env.CF_API_TOKEN,
            CF_ACCOUNT_ID: process.env.CF_ACCOUNT_ID,
          }));
          NODE
      - name: Verify marketplace test
        run: |
          node --input-type=module <<'NODE'
          const baseUrl = process.env.WORKER_URL;
          const eventually = async (path) => {
            let detail = "no response";
            for (let attempt = 0; attempt < 12; attempt += 1) {
              try {
                const response = await fetch(`${baseUrl}${path}`);
                if (response.ok) return response.json();
                detail = `HTTP ${response.status}`;
              } catch (error) {
                detail = error instanceof Error ? error.message : String(error);
              }
              await new Promise((resolve) => setTimeout(resolve, 5_000));
            }
            throw new Error(`${path} unavailable: ${detail}`);
          };
          const health = await eventually("/health");
          if (!health.ok || health.provider !== "d1")
            throw new Error(`Unexpected health response: ${JSON.stringify(health)}`);
          const setup = await eventually("/api/v1/setup/status");
          if (setup.state !== "open" && setup.state !== "complete")
            throw new Error(`Unexpected setup response: ${JSON.stringify(setup)}`);
          NODE
